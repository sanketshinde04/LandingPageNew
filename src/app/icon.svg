<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="deployGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8cff" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.15" />
    </linearGradient>
  </defs>
  
  <!-- App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#080e1a" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4" />
  
  <!-- Subtle inner shadow / highlight -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- DEPLOY Serif 'd' Brand Icon -->
  <text 
    x="50%" 
    y="56%" 
    text-anchor="middle" 
    dominant-baseline="middle" 
    font-family="'Cormorant Garamond', 'Georgia', 'Iowan Old Style', Baskerville, serif" 
    font-style="italic" 
    font-weight="700" 
    font-size="340" 
    fill="url(#deployGrad)">d</text>
</svg>
